# Nginx reverse proxy untuk SIPJOK — template diproses oleh vps-setup.sh
# Setelah certbot --nginx dijalankan, blok 443 + redirect ditambahkan otomatis.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Lampiran modul ajar / dokumen kurikulum bisa sampai 25 MB
    client_max_body_size 25M;

    # HTTP -> HTTPS (aktif setelah certbot; certbot menambahkan bloknya sendiri)
    # location / { proxy_pass http://127.0.0.1:__PORT_APP__; }

    location / {
        proxy_pass http://127.0.0.1:__PORT_APP__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
